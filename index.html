<html>
	<body>
	
		<div id="app"></div>
		
		
		
		
		
<script>
		
			const features = [
			  {
				category: "Fundamentals",
				topics: [
				  "Variables",
				  "Data Types",
				  "Operators",
				  "Functions"
				]
			  },
			  {
				category: "Intermediate",
				topics: [
				  "Arrays",
				  "Objects",
				  "Loops",
				  "DOM Manipulation",
				  "Events"
				]
			  },
			  {
				category: "Advanced",
				topics: [
				  "ES6+",
				  "Promises",
				  "Async/Await",
				  "Modules",
				  "Closures"
				]
			  },
			  {
				category: "Browser APIs",
				topics: [
				  "Local Storage",
				  "Fetch API",
				  "Geolocation"
				]
			  },
			  {
				category: "Frontend",
				topics: [
				  "React",
				  "Next.js"
				]
			  }
			];

			const app = document.getElementById("app");

			features.forEach(section => {

				const card = document.createElement("div");

				card.innerHTML = `
					<h2>${section.category}</h2>
					<ul>
						${section.topics.map(topic =>
							`<li>
								<a href="${topic.toLowerCase().replace(/\s+/g,'-')}.html">
									${topic}
								</a>
							</li>`
						).join("")}
					</ul>
				`;

				app.appendChild(card);
			});
		</script>
	</body>
</html>
